<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JuiceBx — Install on r1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0D0D0D;
      color: #F9FAFB;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .logo { width: 100px; margin-bottom: 16px; border-radius: 20px; }
    h1 { font-size: 28px; font-weight: 300; margin-bottom: 6px; }
    .tagline { color: #8D8D8D; font-size: 14px; margin-bottom: 28px; }
    .qr-container {
      background: #fff;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 24px;
    }
    .qr-container img { width: 260px; height: 260px; display: block; }
    .instructions {
      color: #8D8D8D;
      font-size: 14px;
      line-height: 1.6;
      max-width: 340px;
    }
    .instructions strong { color: #FF5C00; }
    .footer {
      margin-top: 32px;
      color: #555;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <img class="logo" src="logo_master.png" alt="JuiceBx"/>
  <h1>🧃 JuiceBx</h1>
  <p class="tagline">The Juice Box. Where you get the juice from.</p>
  <div class="qr-container">
    <img
      src="https://api.qrserver.com/v1/create-qr-code/?size=520x520&data=https://jerjerrydrive-code.github.io/juicebx/"
      alt="Scan with your r1 to install JuiceBx"
    />
  </div>
  <p class="instructions">
    Open <strong>Creations</strong> on your r1, point the camera at this QR code, and JuiceBx will install as a creation on your device.
  </p>
  <p class="footer">🕊️ 999 Forever 🕊️</p>
</body>
</html>
